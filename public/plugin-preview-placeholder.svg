<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1838"/>
      <stop offset="100%" stop-color="#17122b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 网格线条 -->
  <g opacity="0.06" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- 光晕 -->
  <ellipse cx="600" cy="315" rx="380" ry="280" fill="#7c3aed" opacity="0.08" filter="blur(60px)"/>
  <!-- DSH 宇宙 logo -->
  <g transform="translate(600,270)">
    <!-- 外轨道环 -->
    <ellipse cx="0" cy="0" rx="92" ry="30" fill="none" stroke="#a78bfa" stroke-width="1.2" opacity="0.3" transform="rotate(-18)"/>
    <!-- 内轨道环 -->
    <ellipse cx="0" cy="0" rx="52" ry="18" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.2" transform="rotate(62)"/>
    <!-- 星球 -->
    <circle cx="0" cy="0" r="36" fill="url(#accent)" opacity="0.5"/>
    <circle cx="0" cy="0" r="32" fill="#fff" opacity="0.08"/>
    <!-- 粒子 -->
    <circle cx="70" cy="-50" r="2" fill="#a78bfa" opacity="0.4"/>
    <circle cx="-60" cy="40" r="1.5" fill="#a78bfa" opacity="0.3"/>
    <circle cx="80" cy="30" r="1.5" fill="#a78bfa" opacity="0.25"/>
    <circle cx="-40" cy="-55" r="1" fill="#a78bfa" opacity="0.35"/>
  </g>
  <!-- 文字 -->
  <text x="600" y="370" text-anchor="middle" font-family="system-ui,-apple-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#a78bfa" opacity="0.6">DSH UNIVERSE</text>
  <text x="600" y="400" text-anchor="middle" font-family="system-ui,-apple-ui,sans-serif" font-size="13" letter-spacing="2" fill="#6b7280">No Preview</text>
</svg>